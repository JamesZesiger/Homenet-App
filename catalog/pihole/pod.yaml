# Pi-hole, translated from homenet's services/pihole/docker-compose.yml.
# Rootless podman cannot bind port 53 unless net.ipv4.ip_unprivileged_port_start
# is lowered; see the README. No web password is set: Pi-hole generates one on
# first start and `pihole setpassword` replaces it.
apiVersion: v1
kind: Pod
metadata:
  name: homeapp-pihole
spec:
  restartPolicy: Always
  containers:
    - name: server
      image: 'docker.io/pihole/pihole:${PIHOLE_VERSION}'
      ports:
        - { containerPort: 53, hostPort: ${PIHOLE_DNS_PORT}, hostIP: '${PIHOLE_DNS_BIND}', protocol: TCP }
        - { containerPort: 53, hostPort: ${PIHOLE_DNS_PORT}, hostIP: '${PIHOLE_DNS_BIND}', protocol: UDP }
        - { containerPort: 80, hostPort: ${PIHOLE_WEB_PORT} }
      env:
        - { name: TZ, value: '${TZ}' }
        # Published ports make every query arrive from the gateway, so the
        # default "local" listening mode would refuse them all.
        - { name: FTLCONF_dns_listeningMode, value: all }
        - { name: FTLCONF_dns_upstreams, value: '${PIHOLE_UPSTREAMS}' }
      volumeMounts:
        - { name: etc, mountPath: /etc/pihole }
    # Joins the tailnet as its own device, so tailnet DNS reaches Pi-hole
    # without passing through the host's networking (on Windows, WSL never
    # receives traffic that arrives over the host's Tailscale). First start
    # logs a login URL: `podman logs homeapp-pihole-tailscale`.
    - name: tailscale
      image: docker.io/tailscale/tailscale:stable
      env:
        - { name: TS_HOSTNAME, value: pihole }
        - { name: TS_STATE_DIR, value: /var/lib/tailscale }
        - { name: TS_USERSPACE, value: 'false' }
        - { name: TS_ACCEPT_DNS, value: 'false' }
      securityContext:
        capabilities: { add: [NET_ADMIN, NET_RAW] }
      volumeMounts:
        - { name: tailscale, mountPath: /var/lib/tailscale }
        - { name: tun, mountPath: /dev/net/tun }
  volumes:
    - name: etc
      persistentVolumeClaim: { claimName: homeapp-pihole-etc }
    - name: tailscale
      persistentVolumeClaim: { claimName: homeapp-pihole-tailscale }
    - name: tun
      hostPath: { path: /dev/net/tun, type: CharDevice }
