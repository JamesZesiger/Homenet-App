# Immich, translated from homenet's services/immich/docker-compose.yml. One pod,
# so the four containers reach each other on localhost instead of by service
# name. The database is Immich's own Postgres 14 build (VectorChord and
# pgvecto.rs); its tag moves only when an Immich release note says so.
apiVersion: v1
kind: Pod
metadata:
  name: homeapp-immich
spec:
  restartPolicy: Always
  containers:
    - name: server
      image: 'ghcr.io/immich-app/immich-server:${IMMICH_VERSION}'
      ports:
        - containerPort: 2283
          hostPort: ${IMMICH_PORT}
      env:
        - { name: DB_HOSTNAME, value: localhost }
        - { name: DB_USERNAME, value: '${IMMICH_DB_USERNAME}' }
        - { name: DB_PASSWORD, value: '${IMMICH_DB_PASSWORD}' }
        - { name: DB_DATABASE_NAME, value: '${IMMICH_DB_NAME}' }
        - { name: REDIS_HOSTNAME, value: localhost }
        - { name: IMMICH_MACHINE_LEARNING_URL, value: 'http://localhost:3003' }
        - { name: TZ, value: '${TZ}' }
      volumeMounts:
        - { name: library, mountPath: /data }
    - name: machine-learning
      image: 'ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}'
      env:
        - { name: TZ, value: '${TZ}' }
      volumeMounts:
        - { name: model-cache, mountPath: /cache }
    - name: redis
      image: docker.io/valkey/valkey:8-bookworm
    - name: database
      image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
      env:
        - { name: POSTGRES_USER, value: '${IMMICH_DB_USERNAME}' }
        - { name: POSTGRES_PASSWORD, value: '${IMMICH_DB_PASSWORD}' }
        - { name: POSTGRES_DB, value: '${IMMICH_DB_NAME}' }
        - { name: POSTGRES_INITDB_ARGS, value: '--data-checksums' }
      volumeMounts:
        - { name: pgdata, mountPath: /var/lib/postgresql/data }
  volumes:
    # The originals live on a folder you choose so they can be backed up directly.
    - name: library
      hostPath: { path: '${IMMICH_UPLOAD_LOCATION}', type: DirectoryOrCreate }
    - name: model-cache
      persistentVolumeClaim: { claimName: homeapp-immich-model-cache }
    - name: pgdata
      persistentVolumeClaim: { claimName: homeapp-immich-pgdata }
