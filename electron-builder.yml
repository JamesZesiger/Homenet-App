appId: com.homeapp.app
productName: homeapp
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: catalog
    to: catalog
# castlabs Electron (Widevine) instead of upstream: electron-builder cannot read
# the version from the git dependency, so pin it here alongside package.json.
electronVersion: 44.9.3
electronDownload:
  version: 44.9.3+wvcus
  mirror: https://github.com/castlabs/electron-releases/releases/download/
win:
  target: nsis
nsis:
  # No spaces: GitHub renames them on upload, and latest.yml must name the
  # installer exactly.
  artifactName: ${productName}-Setup-${version}.${ext}
# Where the installed app looks for updates (electron-updater); CI publishes
# the installer, latest.yml and the blockmap to this repo's Releases.
publish:
  provider: github
  owner: JamesZesiger
  repo: Homenet-App
