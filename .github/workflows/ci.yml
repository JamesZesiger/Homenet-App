name: CI

# Every push and PR gets the fast checks. The Windows installer is built for
# PRs into main, for main and develop, and for version tags; a v* tag also
# publishes it as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three checks share their setup, so one matrix runs them as separate jobs.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint, run: npm run lint }
          - { name: static, run: npm run typecheck }
          - { name: test, run: npm test }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  # Production is the Windows TV box, so build the installer there.
  build:
    name: build
    needs: check
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/develop/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: homeapp-windows
          # latest.yml and the blockmap are what installed copies update from.
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  # A v* tag ships: attach the installer to a GitHub Release for that tag.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: homeapp-windows
      - run: gh release create "$GITHUB_REF_NAME" ./*.exe ./*.blockmap latest.yml --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
