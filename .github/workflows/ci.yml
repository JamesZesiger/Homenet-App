name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three checks share their setup, so one matrix runs them as separate jobs.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint, run: npm run lint }
          - { name: static, run: npm run typecheck }
          - { name: test, run: npm test }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  # Production is the Windows TV box, so build the installer there.
  build:
    name: build
    needs: check
     if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/develop/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: homeapp-windows
          path: dist/*.exe
          if-no-files-found: error
